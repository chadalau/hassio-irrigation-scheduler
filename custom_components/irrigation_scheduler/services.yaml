water_now:
  name: Water now
  description: Start watering immediately for a given duration. If no duration is given, the zone default duration is used.
  target:
    entity:
      integration: irrigation_scheduler
  fields:
    duration:
      name: Duration
      description: Duration in seconds (clamped to the zone max duration).
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box

stop:
  name: Stop
  description: Stop watering immediately and turn the target entity off.
  target:
    entity:
      integration: irrigation_scheduler

refill_reservoir:
  name: Refill reservoir
  description: Reset the tracked remaining reservoir volume back to full capacity (reservoir_volume_l).
  target:
    entity:
      integration: irrigation_scheduler

add_schedule:
  name: Add schedule
  description: Add a new irrigation schedule to the zone.
  target:
    entity:
      integration: irrigation_scheduler
  fields:
    time:
      name: Time
      description: Time of day to start watering.
      required: true
      selector:
        time:
    days:
      name: Days
      description: Days of the week when the schedule runs (0 = Monday, 6 = Sunday).
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"
    duration:
      name: Duration
      description: Watering duration in seconds.
      required: true
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    enabled:
      name: Enabled
      description: Whether the schedule starts enabled.
      default: true
      selector:
        boolean:

update_schedule:
  name: Update schedule
  description: Update an existing irrigation schedule.
  target:
    entity:
      integration: irrigation_scheduler
  fields:
    id:
      name: Schedule ID
      description: ID of the schedule to update.
      required: true
      selector:
        text:
    time:
      name: Time
      description: New time of day to start watering.
      selector:
        time:
    days:
      name: Days
      description: New days of the week (0 = Monday, 6 = Sunday).
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"
    duration:
      name: Duration
      description: New watering duration in seconds.
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    enabled:
      name: Enabled
      description: Whether the schedule is enabled.
      selector:
        boolean:

remove_schedule:
  name: Remove schedule
  description: Remove an irrigation schedule.
  target:
    entity:
      integration: irrigation_scheduler
  fields:
    id:
      name: Schedule ID
      description: ID of the schedule to remove.
      required: true
      selector:
        text:

set_schedules:
  name: Set schedules
  description: Replace all schedules of the zone with a new list.
  target:
    entity:
      integration: irrigation_scheduler
  fields:
    schedules:
      name: Schedules
      description: Full list of schedules to set.
      required: true
      selector:
        object:

set_zone_options:
  name: Set zone options
  description: Update optional zone settings (default duration, flow rate, number of pots, reservoir volume and the pH gate for up to two independent reservoirs).
  target:
    entity:
      integration: irrigation_scheduler
  fields:
    default_duration:
      name: Default duration
      description: Default watering duration in seconds, used by water_now when no duration is given. Must not exceed the zone's max_duration.
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    flow_rate_lph:
      name: Flow rate per pot
      description: Watering flow rate PER POT, in liters per hour (multiplied by number_of_pots for the total volume shown on the card).
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: L/h
          mode: box
    number_of_pots:
      name: Number of pots
      description: Number of pots watered by the zone (used for per-pot volume).
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    reservoir_volume_l:
      name: Reservoir volume
      description: Water reservoir volume in liters.
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: L
          mode: box
    ph_entity_id:
      name: pH sensor
      description: Entity id of a pH sensor. When set, SCHEDULED runs only start while its reading is within ph_min/ph_max (water_now always ignores this). Send an empty string to disable the gate.
      selector:
        text:
    ph_min:
      name: Minimum pH
      description: Minimum pH (0-14) that allows a scheduled run to start.
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    ph_max:
      name: Maximum pH
      description: Maximum pH (0-14) that allows a scheduled run to start.
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    ec_entity_id:
      name: EC sensor
      description: Entity id of an EC (conductivity) sensor. Display-only -- it never gates a run, it only feeds the card's EC badge. Send an empty string to clear it.
      selector:
        text:
    ph_entity_id_2:
      name: R2 pH sensor
      description: Entity id of a pH sensor for a SECOND, independent reservoir (e.g. one pump/outlet feeding two tanks). When set, SCHEDULED runs only start while BOTH reservoirs read within their own range. Send an empty string to disable.
      selector:
        text:
    ph_min_2:
      name: R2 minimum pH
      description: Minimum pH (0-14) for the second reservoir.
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    ph_max_2:
      name: R2 maximum pH
      description: Maximum pH (0-14) for the second reservoir.
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    ec_entity_id_2:
      name: R2 EC sensor
      description: Entity id of an EC sensor for the second reservoir. Display-only. Send an empty string to clear it.
      selector:
        text:
    pot_sensors:
      name: Pot moisture sensors
      description: Ordered list of compact pot/row moisture sensors shown by the card. Each item requires a name and a sensor entity_id.
      example:
        - name: Row 1
          entity_id: sensor.row_1_moisture
      selector:
        object:
