[pytest]
# PHCC (pytest-homeassistant-custom-component) ships its fixtures as plain
# `async def` fixtures (e.g. `hass`), which requires pytest-asyncio's "auto"
# mode to be handled. The pure tests in tests/ are sync and are unaffected.
asyncio_mode = auto
# In the pure venv (no pytest-asyncio installed) the option above is unknown;
# silence that one warning so the pure run stays clean.
filterwarnings =
    ignore::pytest.PytestConfigWarning
