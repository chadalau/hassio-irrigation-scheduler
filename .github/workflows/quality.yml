name: Quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt ruff
      - run: ruff check custom_components tests
      - run: python -m pytest tests -q
      - run: python -m compileall -q custom_components

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node smoke.mjs
      - run: npm audit --omit=dev
      - run: git diff --exit-code -- custom_components/irrigation_scheduler/frontend/irrigation-schedule-card.js
        working-directory: .
